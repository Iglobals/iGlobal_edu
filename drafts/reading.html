<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - iGlobals Educational Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ig-purple: #6B2D5C;
            --ig-purple-light: #8B4A7A;
            --ig-ash: #4A4A4A;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: #f3f4f6; overflow: hidden; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }

        /* ── Shell ── */
        .reader-shell { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .reader-body  { display:flex; flex:1; overflow:hidden; }

        /* ── Topbar ── */
        .reader-topbar {
            background: var(--ig-purple); color:white;
            padding: 0 1rem; height:54px;
            display:flex; align-items:center; justify-content:space-between;
            flex-shrink:0; z-index:10;
        }
        .topbar-btn {
            display:flex; align-items:center; gap:0.35rem;
            padding:0.35rem 0.7rem; border-radius:0.4rem;
            font-size:0.78rem; font-weight:600;
            cursor:pointer; transition:background 0.2s;
            background:rgba(255,255,255,0.12); border:none; color:white; text-decoration:none;
        }
        .topbar-btn:hover { background:rgba(255,255,255,0.22); }

        /* ── Progress bar ── */
        .progress-bar-wrap { height:3px; background:#e5e7eb; }
        .progress-bar-fill { height:100%; background:var(--ig-purple); transition:width 0.4s ease; }

        /* ────────────────────────────────
           CHAPTER PANEL — Desktop only
           Slides in from right, overlaid
        ──────────────────────────────── */
        .reader-main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#f3f4f6; position:relative; }

        .chapter-panel-desktop {
            position: absolute;
            top:0; right:0; bottom:0;
            width: 268px;
            background: white;
            border-left: 1px solid #ede9f0;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 20px rgba(0,0,0,0.08);
        }
        .chapter-panel-desktop.open { transform: translateX(0); }

        /* Only show desktop panel on md+ */
        @media (max-width: 767px) {
            .chapter-panel-desktop { display:none !important; }
        }

        /* ────────────────────────────────
           CHAPTER DRAWER — Mobile only
           Full height, 95vw, slides from left
        ──────────────────────────────── */
        .chapter-drawer-mobile {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 95vw;
            max-width: 380px;
            background: white;
            transform: translateX(-100%);
            transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: 6px 0 30px rgba(0,0,0,0.18);
        }
        .chapter-drawer-mobile.open { transform: translateX(0); }

        .drawer-scrim {
            position: fixed; inset:0;
            background: rgba(0,0,0,0.45);
            z-index: 99;
            display:none;
        }
        .drawer-scrim.open { display:block; }

        /* Only show mobile drawer on < md */
        @media (min-width: 768px) {
            .chapter-drawer-mobile, .drawer-scrim { display:none !important; }
        }

        /* Chapter items */
        .ch-item {
            padding:0.6rem 0.9rem; border-radius:0.5rem;
            cursor:pointer; font-size:0.82rem; line-height:1.4;
            color:#6b7280; transition:all 0.15s;
        }
        .ch-item:hover  { background:#faf5ff; color:var(--ig-purple); }
        .ch-item.active { background:#f3e8ff; color:var(--ig-purple); font-weight:700; }

        /* ── Reading area ── */
        .reading-area { flex:1; overflow-y:auto; padding:2rem 1.25rem; }
        @media(min-width:768px){ .reading-area { padding:2.5rem 2rem; } }

        /* Scrollbar */
        .reading-area::-webkit-scrollbar { width:6px; }
        .reading-area::-webkit-scrollbar-thumb { background:#c4b5c4; border-radius:3px; }
        .reading-area::-webkit-scrollbar-thumb:hover { background:var(--ig-purple); }

        /* Content card */
        .book-page {
            max-width: 720px; margin:0 auto;
            background:white; border-radius:0.75rem;
            box-shadow:0 2px 16px rgba(0,0,0,0.07);
            padding:1.5rem; line-height:1.88; color:#374151; font-size:0.95rem;
        }
        @media(min-width:640px){ .book-page { padding:2.5rem 3rem; font-size:1rem; } }

        /* Section cards (reviews, notes) below content */
        .section-card {
            max-width:720px; margin: 1.5rem auto 0;
            background:white; border-radius:0.75rem;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
            padding:1.5rem;
        }
        @media(min-width:640px){ .section-card { padding:2rem 2.5rem; } }

        /* ── Bottom nav ── */
        .page-nav {
            flex-shrink:0; background:white; border-top:1px solid #e5e7eb;
            padding:0.65rem 1.25rem; display:flex; align-items:center; justify-content:space-between;
        }
        .nav-btn {
            display:flex; align-items:center; gap:0.4rem;
            padding:0.5rem 1rem; border-radius:0.5rem;
            font-size:0.82rem; font-weight:600;
            color:var(--ig-purple); background:none; border:none; cursor:pointer; transition:background 0.2s;
        }
        .nav-btn:hover { background:#f3e8ff; }
        .nav-btn:disabled { opacity:0.3; cursor:not-allowed; }

        /* ── Stars ── */
        .star { color:#d1d5db; cursor:pointer; transition:color 0.2s; }
        .star.active { color:#fbbf24; }

        /* ── Reaction btns ── */
        .reaction-btn {
            display:flex; align-items:center; gap:0.3rem;
            padding:0.3rem 0.6rem; border-radius:0.4rem;
            font-size:0.75rem; cursor:pointer; background:none; border:none;
            color:#9ca3af; transition:all 0.2s;
        }
        .reaction-btn:hover { background:#f9fafb; }
        .reaction-btn.liked { color:var(--ig-purple); background:rgba(107,45,92,0.07); }
    </style>
</head>
<body>

<!-- ── Mobile chapter drawer scrim ── -->
<div id="drawerScrim" class="drawer-scrim" onclick="closeChapterDrawer()"></div>

<!-- ── Mobile chapter drawer (95vw, full height, slides from left) ── -->
<div id="chapterDrawerMobile" class="chapter-drawer-mobile">
    <div style="background:var(--ig-purple);flex-shrink:0;">
        <div class="flex items-center justify-between px-5 py-4">
            <div>
                <div class="text-xs font-semibold uppercase tracking-wider" style="color:rgba(255,255,255,0.6);">Contents</div>
                <div id="drawerTitle" class="font-condensed font-bold text-white text-lg leading-tight mt-0.5"></div>
            </div>
            <button onclick="closeChapterDrawer()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.15);">
                <i data-lucide="x" class="w-5 h-5 text-white"></i>
            </button>
        </div>
    </div>
    <div id="chapterListMobile" class="p-3 space-y-1 overflow-y-auto flex-1"></div>
</div>

<div class="reader-shell">

    <!-- ═══ TOP BAR ═══ -->
    <div class="reader-topbar">
        <div class="flex items-center gap-2 min-w-0">
            <a href="library.html" class="topbar-btn flex-shrink-0">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Library</span>
            </a>
            <div class="min-w-0">
                <div id="topTitle" class="font-condensed font-bold text-sm md:text-base text-white leading-tight truncate" style="max-width:260px;"></div>
                <div id="topAuthor" class="text-xs truncate" style="color:rgba(255,255,255,0.6);"></div>
            </div>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
            <!-- Font controls -->
            <button class="topbar-btn" onclick="changeFontSize(-1)">A<i data-lucide="minus" class="w-3 h-3"></i></button>
            <button class="topbar-btn" onclick="changeFontSize(1)">A<i data-lucide="plus" class="w-3 h-3"></i></button>
            <!-- Chapters button — shows drawer on mobile, panel on desktop -->
            <button class="topbar-btn" onclick="toggleChapters()" id="chapterToggleBtn">
                <i data-lucide="list" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Chapters</span>
            </button>
            <!-- Fullscreen -->
            <button class="topbar-btn" onclick="toggleFullscreen()">
                <i data-lucide="maximize" class="w-4 h-4" id="fsIcon"></i>
            </button>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:4%"></div>
    </div>

    <!-- ═══ BODY ═══ -->
    <div class="reader-body">

        <div class="reader-main">

            <!-- Desktop chapter panel (slides from right, hidden on mobile via CSS) -->
            <div id="chapterPanelDesktop" class="chapter-panel-desktop">
                <div class="flex items-center justify-between px-4 py-3 flex-shrink-0" style="border-bottom:1px solid #f3e8ff;">
                    <span class="font-semibold text-sm text-gray-700">Chapters</span>
                    <button onclick="closePanelDesktop()" class="p-1 text-gray-400 hover:text-gray-600 rounded">
                        <i data-lucide="panel-right-close" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="chapterListDesktop" class="p-3 space-y-1 overflow-y-auto flex-1"></div>
            </div>

            <!-- Scrollable reading area -->
            <div class="reading-area" id="readingArea">

                <!-- Content -->
                <div class="book-page" id="pageContent" style="font-size:16px;"></div>

                <!-- Reviews (always below content) -->
                <div class="section-card">
                    <h3 class="font-condensed font-bold text-lg mb-4 flex items-center gap-2" style="color:var(--ig-purple);">
                        <i data-lucide="message-square" class="w-5 h-5"></i> Reviews
                    </h3>
                    <div class="pb-4 mb-4" style="border-bottom:1px solid #f3f4f6;">
                        <p class="text-xs text-gray-400 mb-2 font-medium">Rate this resource</p>
                        <div class="flex gap-1.5 mb-3" id="starRating">
                            <i data-lucide="star" class="w-5 h-5 star" onclick="setRating(1)"></i>
                            <i data-lucide="star" class="w-5 h-5 star" onclick="setRating(2)"></i>
                            <i data-lucide="star" class="w-5 h-5 star" onclick="setRating(3)"></i>
                            <i data-lucide="star" class="w-5 h-5 star" onclick="setRating(4)"></i>
                            <i data-lucide="star" class="w-5 h-5 star" onclick="setRating(5)"></i>
                        </div>
                        <textarea id="reviewText" rows="3" placeholder="Share your thoughts…"
                            style="width:100%;padding:0.65rem 0.85rem;border:1.5px solid #e5e7eb;border-radius:0.5rem;font-family:'Inter',sans-serif;font-size:0.85rem;resize:vertical;outline:none;transition:border-color 0.2s;"
                            onfocus="this.style.borderColor='#6B2D5C'" onblur="this.style.borderColor='#e5e7eb'"></textarea>
                        <button onclick="submitReview()" class="mt-2 px-5 py-2 rounded-lg text-white text-xs font-bold uppercase tracking-wide" style="background:var(--ig-purple);">Post Review</button>
                    </div>
                    <div id="reviewsList" class="space-y-4">
                        <div class="pb-4" style="border-bottom:1px solid #f3f4f6;">
                            <div class="flex justify-between mb-1">
                                <span class="font-semibold text-sm text-gray-800">Adaeze O.</span>
                                <span class="text-xs text-gray-400">3 days ago</span>
                            </div>
                            <div class="flex text-yellow-400 gap-0.5 mb-2">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i><i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i><i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i><i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i><i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                            </div>
                            <p class="text-sm text-gray-600">Incredibly thorough and exam-focused. Every JUPEB student needs this.</p>
                            <div class="flex gap-2 mt-2">
                                <button onclick="likeReview(this)" class="reaction-btn"><i data-lucide="thumbs-up" class="w-3.5 h-3.5"></i><span>8</span></button>
                                <button onclick="likeReview(this)" class="reaction-btn"><i data-lucide="thumbs-down" class="w-3.5 h-3.5"></i><span>0</span></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notes (always below reviews) -->
                <div class="section-card" style="margin-bottom:2rem;">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-condensed font-bold text-lg flex items-center gap-2" style="color:var(--ig-purple);">
                            <i data-lucide="pencil" class="w-5 h-5"></i> My Notes
                        </h3>
                        <button onclick="addNote()" class="flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-white text-xs font-bold uppercase tracking-wide" style="background:#4A4A4A;">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
                        </button>
                    </div>
                    <div id="notesList" class="space-y-3">
                        <div class="p-3 rounded-lg border-l-4" style="background:#fefce8;border-color:#facc15;">
                            <p class="text-sm text-gray-700">"Focus on recurring patterns in past questions."</p>
                            <span class="text-xs text-gray-400 mt-1 block">Chapter 1</span>
                        </div>
                    </div>
                </div>

            </div><!-- end reading-area -->

            <!-- Bottom nav -->
            <div class="page-nav">
                <button class="nav-btn" id="prevBtn" onclick="prevPage()">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Previous</span>
                </button>
                <div class="text-center">
                    <div class="text-xs text-gray-400">Chapter</div>
                    <div class="text-sm font-bold text-gray-700">
                        <span id="currentPage">1</span><span class="text-gray-300 mx-1">/</span><span id="totalPages">1</span>
                    </div>
                </div>
                <button class="nav-btn" id="nextBtn" onclick="nextPage()">
                    <span class="hidden sm:inline">Next</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

        </div><!-- end reader-main -->
    </div><!-- end reader-body -->
</div><!-- end reader-shell -->


<script>
    // ── All book data ──
    const books = {
        1: { title:'Scientific Inquiries Vol. I', author:'Prof. Emeka Eze', chapters:['Forces & Motion','Chemical Reactions','Cell Biology','Waves & Optics','Organic Chemistry','Genetics & Heredity','Exam Strategy & Past Q'],
            content:[
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 1: Forces &amp; Motion</h2><p class="mb-4">Understanding Newton's laws is the backbone of JUPEB Physics. The examiner consistently sets questions around the three laws of motion — and the trick is not just to state them, but to apply them to real scenarios within a strict time limit.</p><p class="mb-4">Start with free-body diagrams. Before writing a single equation, draw out all forces acting on the object. Label each force clearly: weight (W = mg), normal reaction (N), tension (T), and friction (f = μN).</p><p class="mb-4">Newton's second law (F = ma) is the workhorse of mechanics questions. Watch for questions where multiple forces act in different directions — resolve them into components first. Practice resolving on inclined planes, as these appear in at least one question per paper.</p><p class="mb-4">For circular motion, memorise the centripetal acceleration formula (a = v²/r) and know when to apply it versus when the question is asking about linear motion.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 2: Chemical Reactions</h2><p class="mb-4">JUPEB Chemistry rewards students who can move quickly between symbolic, particulate, and macroscopic representations of reactions. Practice writing balanced equations daily — this is non-negotiable.</p><p class="mb-4">Redox chemistry is heavily tested. Learn to assign oxidation numbers confidently and identify oxidation/reduction in half-equations. The examiner often presents an unfamiliar reaction and asks you to identify the oxidising agent — use oxidation number changes as your compass.</p><p class="mb-4">Acid-base questions test both Arrhenius and Brønsted-Lowry definitions. Know the conjugate acid-base pairs for common substances. pH calculations appear almost every year.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 3: Cell Biology</h2><p class="mb-4">Biology at JUPEB level rewards precision in definitions and accuracy in diagrams. The cell chapter is almost always represented in the objective section — know the differences between prokaryotic and eukaryotic cells in detail.</p><p class="mb-4">Organelle functions must be memorised with precision. Examiners will ask you to distinguish between the rough and smooth ER, or explain why a liver cell has more mitochondria than a fat cell.</p><p class="mb-4">Osmosis and diffusion questions appear repeatedly. Know how to calculate water potential (Ψ = Ψs + Ψp) and apply it to predict the direction of water movement.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 4: Waves &amp; Optics</h2><p class="mb-4">Waves questions test your ability to read and interpret wave diagrams. Given a displacement-time or displacement-position graph, you must extract amplitude, wavelength, frequency, and speed quickly.</p><p class="mb-4">Reflection, refraction, and total internal reflection are reliably tested. For refraction, know Snell's law (n₁sinθ₁ = n₂sinθ₂) and be able to find the critical angle when given refractive indices.</p><p class="mb-4">Lens questions use the lens equation (1/f = 1/v + 1/u). Sign conventions matter. Practice both object-inside and object-outside the focal length scenarios.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 5: Organic Chemistry</h2><p class="mb-4">Homologous series form the foundation of organic chemistry. Know the general formula, functional group, and key reactions for alkanes, alkenes, alkynes, alcohols, aldehydes, ketones, carboxylic acids, and esters.</p><p class="mb-4">Isomerism is a favourite examiner topic. Structural isomers appear in objectives; stereoisomers appear in essays. Draw all possible isomers systematically — start from the longest chain and work down.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 6: Genetics &amp; Heredity</h2><p class="mb-4">Genetics questions range from simple Mendelian inheritance to dihybrid crosses, codominance, and sex-linked traits. The key skill is constructing a correct Punnett square quickly and reading off phenotypic and genotypic ratios without error.</p><p class="mb-4">For dihybrid crosses, always state your key first. Define the allele symbols clearly before writing any cross. The examiner deducts marks for undefined symbols.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 7: Exam Strategy</h2><p class="mb-4">The JUPEB Science paper is three hours long: 50 objectives (1 hour) and 4 essays from 8 choices (2 hours). If a question takes more than 90 seconds, skip and return.</p><p class="mb-4">For essays, always plan before you write. Spend the first 2 minutes outlining your four key points. A well-organised 400-word answer beats a disorganised 700-word one every time.</p><p class="mb-4">Past question analysis (2018–2024) shows that Physics questions on mechanics and electricity, Chemistry on electrochemistry and organic reactions, and Biology on genetics and ecology appear with near-100% frequency.</p>`
            ]
        },
        2: { title:'Business Analytics Mastery', author:'Dr. Ngozi Okafor', chapters:['Demand & Supply','Accounting Basics','Business Finance','Market Structures','Exam Strategy'],
            content:[
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 1: Demand &amp; Supply</h2><p class="mb-4">The law of demand and supply underpins every Economics question. JUPEB tests your ability to apply these laws — draw demand and supply curves confidently and shift them in response to stated changes in conditions.</p><p class="mb-4">Price elasticity of demand (PED) is tested both as a calculation and as a concept. Know the formula (PED = % change in Qd / % change in P), interpret the result, and explain real-world implications for a business or government.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 2: Accounting Fundamentals</h2><p class="mb-4">Double-entry bookkeeping: every debit has an equal and opposite credit. Internalise the DEAD CLIC mnemonic — Debits increase Expenses, Assets, Drawings; Credits increase Capital, Liabilities, Income.</p><p class="mb-4">Trial balance, trading account, and profit & loss account questions follow a predictable structure. Practice working from a given trial balance to produce a set of final accounts within 20 minutes.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 3: Business Finance</h2><p class="mb-4">Sources of finance — internal vs. external, short-term vs. long-term — are a standard objective question topic. Know the advantages and disadvantages of each: retained earnings, bank loans, debentures, share issues, and trade credit.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 4: Market Structures</h2><p class="mb-4">The four market structures — perfect competition, monopolistic competition, oligopoly, and monopoly — are tested by comparing their characteristics across six dimensions: number of firms, barriers to entry, product differentiation, price control, profit type, and efficiency.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 5: Exam Strategy for Commercial</h2><p class="mb-4">The Commercial paper rewards speed and precision equally. For Economics essay questions, always include a labelled diagram — an unmarked diagram gains zero. For Accounting questions, show all working.</p>`
            ]
        },
        3: { title:'Creative Strategies in Literature', author:'Dr. Amaka Chukwu', chapters:['Literature in English','Government & Politics','CRS / IRS','Essay Technique','Exam Strategy'],
            content:[
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 1: Literature in English</h2><p class="mb-4">Literature at JUPEB tests three things: knowledge of set texts, ability to identify and discuss literary devices, and the skill of constructing a coherent argument in essay form. Essay construction is the most important — it is where marks are made or lost.</p><p class="mb-4">For poetry, memorise the title, poet, thematic concerns, and at least three literary devices for each poem. When the examiner asks you to "analyse the use of imagery," they are asking for device + quotation + effect.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 2: Government &amp; Politics</h2><p class="mb-4">Government questions are split between conceptual definitions and Nigerian/comparative political analysis. For definitions, give the academic definition first, then illustrate with an example.</p><p class="mb-4">Nigerian political history is heavily tested: the colonial period, independence (1960), the first republic (1963–1966), military rule periods, and the return to democracy in 1999. Build a timeline and memorise key events and actors.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 3: CRS / IRS</h2><p class="mb-4">For CRS, the examiner tests knowledge of Old and New Testament narratives, key figures, and theological themes. Categorise your knowledge by theme: covenant, prophecy, faith, redemption.</p><p class="mb-4">For IRS, focus on the five pillars of Islam, the life of the Prophet, the Qur'anic revelation, and Islamic jurisprudence (Fiqh).</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 4: Essay Technique</h2><p class="mb-4">A strong Arts essay has four components: introduction (with thesis), body paragraphs (each with one main point), evidence (quotation or example), and a conclusion that returns to the thesis. Five-paragraph essays consistently earn the highest marks.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 5: Exam Strategy for Arts</h2><p class="mb-4">The Arts paper is essay-heavy. Spend no more than 35 minutes per essay. If you write slowly, practice writing by hand at timed intervals during revision — raw writing speed matters.</p>`
            ]
        },
        4: { title:'JUPEB Mastery Complete Guide', author:'iGlobals Editorial Team', chapters:['Understanding JUPEB','Revision Planning','Exam Day Strategy','Mental Preparation'],
            content:[
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 1: Understanding JUPEB</h2><p class="mb-4">The Joint Universities Preliminary Examinations Board (JUPEB) is a rigorous pre-degree programme that provides an alternative route to university admission. Understanding its structure is your first competitive advantage.</p><p class="mb-4">JUPEB examinations are set at A-level standard and are accepted by over 30 Nigerian federal and state universities. Grades range from A (70–100%) through F (below 45%). Your target should always be an A.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 2: Building Your Revision Plan</h2><p class="mb-4">The single greatest predictor of JUPEB success is not intelligence — it is consistency. A student who studies 2 focused hours daily for 90 days will outperform a student who crammed for 3 weeks before the exam.</p><p class="mb-4">Build a 12-week revision plan. Weeks 1–4: cover all syllabus topics once. Weeks 5–8: revisit weak areas and begin past question practice. Weeks 9–12: full past papers under timed conditions.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 3: Exam Day Execution</h2><p class="mb-4">Sleep is not optional. Students who sleep fewer than 7 hours on the night before an exam perform measurably worse on reasoning and recall tasks. Prioritise sleep over last-minute cramming.</p><p class="mb-4">Arrive early. Read through the question paper calmly before you begin writing, and allocate your time before writing a single word.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chapter 4: Mental Preparation</h2><p class="mb-4">Exam anxiety is real, but it is manageable. The most effective technique is controlled breathing: inhale for 4 counts, hold for 4, exhale for 4. Do this 5 times before entering the examination hall.</p><p class="mb-4">The students who score highest are not always the smartest in the room. They are the most strategic, the most consistent, and the most composed under pressure.</p>`
            ]
        },
        5: { title:'JUPEB Past Questions & Answers', author:'iGlobals Research Unit', chapters:['2024 Science Paper','2023 Commercial Paper','2022 Arts Paper','2021 High Frequency','Answer Techniques'],
            content:[
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">2024 JUPEB Science — Selected Questions</h2><p class="mb-3 font-semibold text-gray-500 text-sm uppercase tracking-wide">Physics</p><p class="mb-3"><strong style="color:#6B2D5C">Q1.</strong> A body of mass 5 kg acted on by a force of 20 N for 4 seconds from rest. Find the velocity at t = 4s.<br><em class="text-gray-400 text-sm">Answer: 16 m/s — F=ma → a=4 m/s², v=u+at=16</em></p><p class="mb-3"><strong style="color:#6B2D5C">Q2.</strong> Define simple harmonic motion and state two examples.<br><em class="text-gray-400 text-sm">Motion where a ∝ −x. Examples: pendulum, mass-spring system.</em></p><p class="mb-3 font-semibold text-gray-500 text-sm uppercase tracking-wide mt-5">Chemistry</p><p class="mb-3"><strong style="color:#6B2D5C">Q3.</strong> Write the equation for complete combustion of propane (C₃H₈).<br><em class="text-gray-400 text-sm">C₃H₈ + 5O₂ → 3CO₂ + 4H₂O</em></p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">2023 JUPEB Commercial — Selected Questions</h2><p class="mb-3"><strong style="color:#6B2D5C">Q1.</strong> Using a labelled diagram, explain the effect of a decrease in consumer income on the demand for a normal good.<br><em class="text-gray-400 text-sm">Demand curve shifts left. At every price, quantity demanded falls.</em></p><p class="mb-3"><strong style="color:#6B2D5C">Q2.</strong> Distinguish between average cost and marginal cost.<br><em class="text-gray-400 text-sm">AC = TC/Q. MC = ΔTC/ΔQ. When MC &lt; AC, AC falls; when MC > AC, AC rises.</em></p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">2022 JUPEB Arts — Selected Questions</h2><p class="mb-3"><strong style="color:#6B2D5C">Q1. Literature:</strong> Discuss the role of fate versus free will in any TWO texts on your reading list.<br><em class="text-gray-400 text-sm">Outline: thesis → Text 1 (3 paragraphs with quotes) → Text 2 → comparative conclusion.</em></p><p class="mb-3"><strong style="color:#6B2D5C">Q2. Government:</strong> Account for the collapse of the First Republic in Nigeria (1966).<br><em class="text-gray-400 text-sm">Key: regional rivalries, corruption, electoral fraud in 1964, Tiv riots, January 1966 coup.</em></p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">2021 High Frequency Topics</h2><p class="mb-2 font-semibold text-gray-500 text-sm uppercase tracking-wide">Science</p><p class="mb-3">Mole calculations, redox half-equations, pedigree charts in genetics, energy transformations, ray diagrams for lenses.</p><p class="mb-2 font-semibold text-gray-500 text-sm uppercase tracking-wide mt-4">Commercial</p><p class="mb-3">PED calculations, trial balance to final accounts, market structure characteristics, functions of a central bank.</p><p class="mb-2 font-semibold text-gray-500 text-sm uppercase tracking-wide mt-4">Arts</p><p class="mb-3">Forms of government, literary devices in poetry, themes in set texts, Nigerian constitutional history post-independence.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Answer Techniques</h2><p class="mb-4"><strong>For calculation questions:</strong> Show every step. Write the formula, substitute values with units, simplify, and state the final answer with units. Process marks are awarded — a wrong final answer with correct working still earns partial credit.</p><p class="mb-4"><strong>For essay questions:</strong> The highest-scoring answers begin with a clear definition or thesis, use subject-specific vocabulary, and conclude by directly answering the question asked.</p><p class="mb-4"><strong>For diagram questions:</strong> Label every component. A diagram without labels scores zero. Use a ruler for straight lines.</p>`
            ]
        },
        6: { title:'Chemistry & Biology Breakdown', author:'Dr. Tunde Adeyemi', chapters:['Atomic Structure','Chemical Bonding','Cell Structure','Photosynthesis & Respiration','Ecology'],
            content:[
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Atomic Structure</h2><p class="mb-4">Atomic structure questions test your knowledge of protons, neutrons, electrons, and their arrangement in shells. For JUPEB, know how to write electronic configurations for elements Z = 1 to Z = 36 using the Aufbau principle.</p><p class="mb-4">The periodic table trends — atomic radius, ionisation energy, electronegativity, and electron affinity — are tested in objective questions. Internalise the direction of each trend across periods and down groups.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Chemical Bonding</h2><p class="mb-4">Know the three primary bond types — ionic, covalent, and metallic — and their properties. Examiners test these by asking you to predict bond type from electronegativity difference or to explain physical properties in terms of bonding.</p><p class="mb-4">Lewis (dot-and-cross) diagrams are a must. Practice drawing them for at least 20 molecules.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Cell Structure &amp; Function</h2><p class="mb-4">Plant vs. animal cell differences are almost certain to appear. Build a table comparing: cell wall, vacuole, chloroplasts, centrioles, and lysosomes.</p><p class="mb-4">Know the fine structure of the mitochondrion (cristae, matrix, inner/outer membrane) and the chloroplast (thylakoid, granum, stroma).</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Photosynthesis &amp; Respiration</h2><p class="mb-4">Photosynthesis: know both the light-dependent and light-independent reactions. The light-dependent stage occurs in the thylakoid membrane; the Calvin cycle occurs in the stroma.</p><p class="mb-4">Aerobic respiration: glycolysis (cytoplasm) → link reaction (matrix) → Krebs cycle (matrix) → ETC (inner mitochondrial membrane). Total ATP yield: ~36–38 per glucose.</p>`,
                `<h2 class="font-condensed text-2xl font-bold mb-5" style="color:#6B2D5C">Ecology</h2><p class="mb-4">Ecology questions test food chains, food webs, energy flow, nutrient cycling, and human impact on ecosystems. Draw food webs from given data and correctly identify producers, consumers, and decomposers.</p><p class="mb-4">The nitrogen cycle, carbon cycle, and water cycle are tested as essay topics. For each, know the key processes, organisms involved, and human activities that disrupt the cycle.</p>`
            ]
        }
    };

    // ── State ──
    let bookId = 1;
    let currentPage = 1;
    let currentRating = 0;
    let fontSize = 16;
    let desktopPanelOpen = false;

    // ── Init from URL params ──
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        bookId = parseInt(params.get('book')) || 1;
        if (!books[bookId]) bookId = 1;
        currentPage = parseInt(params.get('page')) || 1;

        const book = books[bookId];
        document.title = book.title + ' — iGlobals Reader';
        document.getElementById('topTitle').textContent = book.title;
        document.getElementById('topAuthor').textContent = 'By ' + book.author;
        document.getElementById('drawerTitle').textContent = book.title;
        document.getElementById('totalPages').textContent = book.chapters.length;

        renderChapters();
        renderPage();
        lucide.createIcons();
    });

    // ── Render chapter lists (desktop panel + mobile drawer) ──
    function renderChapters() {
        const book = books[bookId];
        const makeItem = (ch, i) =>
            `<div class="ch-item ${i + 1 === currentPage ? 'active' : ''}" onclick="goToChapter(${i+1})">
                <span style="opacity:0.35;font-size:0.72rem;font-weight:700;margin-right:0.4rem;">${String(i+1).padStart(2,'0')}</span>${ch}
            </div>`;
        const html = book.chapters.map(makeItem).join('');
        document.getElementById('chapterListDesktop').innerHTML = html;
        document.getElementById('chapterListMobile').innerHTML = html;
    }

    function goToChapter(n) {
        currentPage = n;
        renderPage();
        // Highlight in all lists
        document.querySelectorAll('.ch-item').forEach((el, i) => {
            el.className = `ch-item ${i + 1 === n ? 'active' : ''}`;
        });
        // Close mobile drawer after picking
        if (window.innerWidth < 768) closeChapterDrawer();
    }

    // ── Render page ──
    function renderPage() {
        const book = books[bookId];
        const idx = Math.min(currentPage - 1, book.content.length - 1);
        document.getElementById('pageContent').innerHTML = book.content[idx];
        document.getElementById('pageContent').style.fontSize = fontSize + 'px';
        document.getElementById('currentPage').textContent = currentPage;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= book.chapters.length;
        const pct = book.chapters.length > 1 ? ((currentPage-1)/(book.chapters.length-1))*96+4 : 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('readingArea').scrollTo({ top: 0, behavior: 'smooth' });
        lucide.createIcons();
    }

    function nextPage() { if (currentPage < books[bookId].chapters.length) { currentPage++; goToChapter(currentPage); } }
    function prevPage() { if (currentPage > 1) { currentPage--; goToChapter(currentPage); } }

    // ── Font size ──
    function changeFontSize(dir) {
        fontSize = Math.max(13, Math.min(22, fontSize + dir * 1.5));
        document.getElementById('pageContent').style.fontSize = fontSize + 'px';
    }

    // ── Chapters toggle — desktop panel OR mobile drawer based on viewport ──
    function toggleChapters() {
        if (window.innerWidth < 768) {
            openChapterDrawer();
        } else {
            desktopPanelOpen ? closePanelDesktop() : openPanelDesktop();
        }
    }
    function openPanelDesktop() {
        desktopPanelOpen = true;
        document.getElementById('chapterPanelDesktop').classList.add('open');
    }
    function closePanelDesktop() {
        desktopPanelOpen = false;
        document.getElementById('chapterPanelDesktop').classList.remove('open');
    }
    function openChapterDrawer() {
        document.getElementById('chapterDrawerMobile').classList.add('open');
        document.getElementById('drawerScrim').classList.add('open');
    }
    function closeChapterDrawer() {
        document.getElementById('chapterDrawerMobile').classList.remove('open');
        document.getElementById('drawerScrim').classList.remove('open');
    }

    // ── Fullscreen ──
    function toggleFullscreen() {
        const icon = document.getElementById('fsIcon');
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            icon.setAttribute('data-lucide','minimize');
        } else {
            document.exitFullscreen();
            icon.setAttribute('data-lucide','maximize');
        }
        lucide.createIcons();
    }

    // ── Star rating ──
    function setRating(n) {
        currentRating = n;
        document.querySelectorAll('#starRating .star').forEach((s, i) => s.classList.toggle('active', i < n));
    }

    // ── Submit review ──
    function submitReview() {
        if (!currentRating) { alert('Please select a star rating.'); return; }
        const text = document.getElementById('reviewText').value.trim();
        if (!text) { alert('Please write a review.'); return; }
        const stars = Array(currentRating).fill('<i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>').join('');
        document.getElementById('reviewsList').insertAdjacentHTML('afterbegin',
            `<div class="pb-4" style="border-bottom:1px solid #f3f4f6;">
                <div class="flex justify-between mb-1"><span class="font-semibold text-sm text-gray-800">You</span><span class="text-xs text-gray-400">Just now</span></div>
                <div class="flex text-yellow-400 gap-0.5 mb-2">${stars}</div>
                <p class="text-sm text-gray-600">${text}</p>
            </div>`);
        document.getElementById('reviewText').value = '';
        currentRating = 0;
        setRating(0);
        lucide.createIcons();
    }

    // ── Like ──
    function likeReview(btn) {
        btn.classList.toggle('liked');
        const s = btn.querySelector('span');
        s.textContent = parseInt(s.textContent) + (btn.classList.contains('liked') ? 1 : -1);
    }

    // ── Add note ──
    function addNote() {
        const note = prompt('Enter your note:');
        if (!note) return;
        document.getElementById('notesList').insertAdjacentHTML('afterbegin',
            `<div class="p-3 rounded-lg border-l-4" style="background:#fefce8;border-color:#facc15;">
                <p class="text-sm text-gray-700">"${note}"</p>
                <span class="text-xs text-gray-400 mt-1 block">Chapter ${currentPage}</span>
            </div>`);
    }

    // Keyboard nav
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') nextPage();
        if (e.key === 'ArrowLeft')  prevPage();
        if (e.key === 'Escape') { closePanelDesktop(); closeChapterDrawer(); }
    });
</script>
</body>
</html>
