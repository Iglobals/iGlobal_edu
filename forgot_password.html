<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - iGlobals Educational Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 font-['Inter'] h-screen overflow-hidden flex">

    <!-- Left Side (Form) -->
    <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-16 bg-white overflow-y-auto">
        <div class="max-w-md mx-auto w-full">
            <a href="index.html" class="flex items-center space-x-3 mb-12">
                <div class="w-10 h-10 bg-[#6B2D5C] rounded flex items-center justify-center">
                    <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-[#6B2D5C] tracking-wide font-condensed">IGLOBALS</span>
                    <span class="text-[10px] text-gray-500 tracking-widest uppercase">Educational Services</span>
                </div>
            </a>

            <div class="mb-8">
                <div class="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mb-6">
                    <i data-lucide="key" class="w-8 h-8 text-[#6B2D5C]"></i>
                </div>
                <h1 class="font-condensed text-4xl font-bold text-[#6B2D5C] mb-2">Reset Password</h1>
                <p class="text-gray-500">Enter your email and we'll send you a link to reset your password.</p>
            </div>

            <form class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Email
                        Address</label>
                    <input type="email" class="input-field" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="btn-primary w-full py-4 rounded text-lg font-bold">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-8 text-center text-sm">
                <a href="login.html"
                    class="text-gray-600 hover:text-[#6B2D5C] font-bold flex items-center justify-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Right Side (Image) -->
    <div class="hidden md:block w-1/2 bg-[#6B2D5C] relative overflow-hidden">
        <div class="absolute inset-0 opacity-10"
            style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 30px 30px;">
        </div>
        <div class="absolute inset-0 flex items-center justify-center">
            <i data-lucide="lock" class="w-64 h-64 text-white/5"></i>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
