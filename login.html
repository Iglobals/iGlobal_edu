<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - iGlobals Educational Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 font-['Inter'] h-screen overflow-hidden flex">

    <!-- Left Side (Form) -->
    <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-16 bg-white overflow-y-auto">
        <div class="max-w-md mx-auto w-full">
            <!-- Logo -->
            <a href="index.html" class="flex items-center space-x-3 mb-12">
                <div class="w-10 h-10 bg-[#6B2D5C] rounded flex items-center justify-center">
                    <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-[#6B2D5C] tracking-wide font-condensed">IGLOBALS</span>
                    <span class="text-[10px] text-gray-500 tracking-widest uppercase">Educational Services</span>
                </div>
            </a>

            <h1 class="font-condensed text-4xl font-bold text-[#6B2D5C] mb-2">Welcome Back</h1>
            <p class="text-gray-500 mb-8">Sign in to access your digital library.</p>

            <form action="library.html" method="GET" class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Email
                        Address</label>
                    <input type="email" class="input-field" placeholder="you@example.com" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="mr-2 text-[#6B2D5C] focus:ring-[#6B2D5C] rounded">
                        Remember me
                    </label>
                    <a href="forgot_password.html" class="text-sm text-[#6B2D5C] font-bold hover:underline">Forgot
                        Password?</a>
                </div>

                <button type="submit" class="btn-primary w-full py-4 rounded text-lg font-bold">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600">
                Don't have an account?
                <a href="signup.html" class="text-[#6B2D5C] font-bold hover:underline">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Right Side (Image) -->
    <div class="hidden md:block w-1/2 bg-[#6B2D5C] relative overflow-hidden">
        <!-- Abstract Decoration -->
        <div class="absolute inset-0 opacity-20">
            <div
                class="absolute top-0 -left-20 w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-30">
            </div>
            <div
                class="absolute bottom-0 -right-20 w-96 h-96 bg-[#00A4B4] rounded-full mix-blend-overlay filter blur-3xl opacity-30">
            </div>
            <div
                class="text-[400px] font-bold text-white absolute -bottom-20 -right-20 opacity-5 font-condensed leading-none">
                IG</div>
        </div>

        <div class="absolute inset-0 flex flex-col justify-center items-center p-12 text-center z-10">
            <h2 class="font-condensed text-5xl font-bold text-white mb-6">Redefining Assessments</h2>
            <p class="text-purple-100 text-xl max-w-lg leading-relaxed">
                Exams made simple, secure, and beautiful. Join thousands of students achieving excellence with iGlobals.
            </p>

            <!-- Floating Elements Mockup -->
            <div class="mt-12 relative w-64 h-64">
                <div
                    class="absolute inset-0 bg-white/10 backdrop-blur-md rounded-xl border border-white/20 transform rotate-6 shadow-2xl flex items-center justify-center">
                    <i data-lucide="library" class="w-32 h-32 text-white/80"></i>
                </div>
                <div
                    class="absolute inset-0 bg-white/10 backdrop-blur-md rounded-xl border border-white/20 transform -rotate-6 scale-90 shadow-xl -z-10 translate-y-4">
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
