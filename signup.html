<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - iGlobals Educational Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 font-['Inter'] h-screen overflow-hidden flex">

    <!-- Left Side (Form) -->
    <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-16 bg-white overflow-y-auto">
        <div class="max-w-md mx-auto w-full">
            <a href="index.html" class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 bg-[#6B2D5C] rounded flex items-center justify-center">
                    <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-[#6B2D5C] tracking-wide font-condensed">IGLOBALS</span>
                    <span class="text-[10px] text-gray-500 tracking-widest uppercase">Educational Services</span>
                </div>
            </a>

            <h1 class="font-condensed text-4xl font-bold text-[#6B2D5C] mb-2">Create Account</h1>
            <p class="text-gray-500 mb-8">Join the community of scholars.</p>

            <form action="library.html" method="GET" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Full Name</label>
                    <input type="text" class="input-field" placeholder="John Doe" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Email
                        Address</label>
                    <input type="email" class="input-field" placeholder="you@example.com" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Confirm
                        Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="flex items-start">
                    <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="mr-2 mt-1 text-[#6B2D5C] focus:ring-[#6B2D5C] rounded" required>
                        <span>I agree to the <a href="#" class="text-[#6B2D5C] font-bold hover:underline">Terms of
                                Service</a> & <a href="#" class="text-[#6B2D5C] font-bold hover:underline">Privacy
                                Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary w-full py-4 rounded text-lg font-bold">
                    Sign Up
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600">
                Already have an account?
                <a href="login.html" class="text-[#6B2D5C] font-bold hover:underline">Log In</a>
            </div>
        </div>
    </div>

    <!-- Right Side (Image) -->
    <div class="hidden md:block w-1/2 bg-[#4A4A4A] relative overflow-hidden">
        <div class="absolute inset-0 opacity-20">
            <div
                class="absolute bottom-0 left-0 w-full h-full bg-gradient-to-t from-[#6B2D5C] to-transparent mix-blend-overlay">
            </div>
        </div>

        <div class="absolute inset-0 flex flex-col justify-center items-center p-12 text-center z-10">
            <h2 class="font-condensed text-5xl font-bold text-white mb-6">Start Your Journey</h2>
            <p class="text-gray-300 text-xl max-w-lg leading-relaxed">
                Unlock access to the most comprehensive library of exam preparation materials tailored for your success.
            </p>
            <!-- Decoration -->
            <div class="mt-12">
                <i data-lucide="graduation-cap" class="w-48 h-48 text-white/10"></i>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
