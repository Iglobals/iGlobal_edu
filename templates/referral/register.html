<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration - iGlobals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
        :root { --p: #2F1341; --pl: #4A1F5C; }
        .btn { background: var(--p); color: white; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; transition: all .3s; }
        .btn:hover { background: var(--pl); transform: translateY(-1px); }
        .field { width:100%; padding:.75rem 1rem; border:2px solid #e5e7eb; border-radius:.5rem; transition:border-color .2s; outline:none; }
        .field:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(47,19,65,.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <a href="/" class="flex items-center gap-3 mb-8">
        <div class="w-9 h-9 rounded bg-[#2F1341] flex items-center justify-center">
            <span class="text-white font-bold text-xs font-condensed">IG</span>
        </div>
        <div>
            <div class="font-bold text-[#2F1341] font-condensed tracking-wide">IGLOBALS</div>
            <div class="text-[10px] text-gray-400 uppercase tracking-widest">Agent Portal</div>
        </div>
    </a>

    <h1 class="font-condensed text-3xl font-bold text-[#2F1341] mb-1">Become an Agent</h1>
    <p class="text-gray-500 text-sm mb-6">Register to get your referral code and start earning.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-4 px-4 py-3 rounded-lg text-sm font-medium flex items-center gap-2
          {% if cat == 'danger' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">First Name</label>
                <input type="text" name="first_name" class="field" placeholder="John" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">Username</label>
                <input type="text" name="username" class="field" placeholder="john_doe" required>
            </div>
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">Email</label>
            <input type="email" name="email" class="field" placeholder="you@example.com" required>
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">Password</label>
            <input type="password" name="password" class="field" placeholder="Min. 6 characters" required minlength="6">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">Confirm Password</label>
            <input type="password" name="confirm_password" class="field" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn w-full py-3 rounded-lg text-sm mt-2">Create Agent Account</button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account? <a href="{{ url_for('agent_login') }}" class="text-[#2F1341] font-bold hover:underline">Sign in</a>
    </p>
</div>
</body>
</html>
