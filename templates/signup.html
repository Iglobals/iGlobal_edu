<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - iGlobals Educational Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ig-purple: #2F1341;
            --ig-purple-light: #4A1F5C;
        }
        body { font-family: 'Inter', sans-serif; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
        .btn-primary {
            background-color: var(--ig-purple);
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: var(--ig-purple-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(107, 45, 92, 0.3);
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--ig-purple);
            box-shadow: 0 0 0 3px rgba(107, 45, 92, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 font-['Inter'] h-screen overflow-hidden flex">

    <!-- Left Side (Form) -->
    <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-16 bg-white overflow-y-auto">
        <div class="max-w-md mx-auto w-full">
            <a href="{{ url_for('index') }}" class="flex items-center space-x-3 mb-8">
                <img src="{{ url_for('static', filename='logo.png') }}" class="w-13 h-12" alt="">
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-[#2F1341] tracking-wide font-condensed">IGLOBALS</span>
                    <span class="text-[10px] text-gray-500 tracking-widest uppercase">Educational Services</span>
                </div>
            </a>

            <h1 class="font-condensed text-4xl font-bold text-[#2F1341] mb-2">Create Account</h1>
            <p class="text-gray-500 mb-8">Join the community of scholars.</p>

            <form action="{{ url_for('signup') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Full Name</label>
                    <input type="text" name="full_name" class="input-field" placeholder="John Doe" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Email Address</label>
                    <input type="email" name="email" class="input-field" placeholder="you@example.com" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Password</label>
                    <input type="password" name="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Confirm Password</label>
                    <input type="password" name="confirm_password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="flex items-start">
                    <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="mr-2 mt-1 text-[#2F1341] focus:ring-[#2F1341] rounded" required>
                        <span>I agree to the <a href="#" class="text-[#2F1341] font-bold hover:underline">Terms of Service</a> & <a href="#" class="text-[#2F1341] font-bold hover:underline">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary w-full py-4 rounded text-lg font-bold">
                    Sign Up
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-[#2F1341] font-bold hover:underline">Log In</a>
            </div>
        </div>
    </div>

    <!-- Right Side (Image) -->
    <div class="hidden md:block w-1/2 relative overflow-hidden">
        <img src="https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=1200&q=80" alt="Arts Study" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-br from-[#4A4A4A]/90 to-[#4A4A4A]/70"></div>

        <div class="absolute inset-0 flex flex-col justify-center items-center p-12 text-center z-10">
            <h2 class="font-condensed text-5xl font-bold text-white mb-6">Start Your Journey</h2>
            <p class="text-gray-300 text-xl max-w-lg leading-relaxed">
                Unlock access to the most comprehensive library of exam preparation materials tailored for your success.
            </p>
            <!-- Decoration -->
            <div class="mt-12">
                <i data-lucide="graduation-cap" class="w-48 h-48 text-white/10"></i>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
